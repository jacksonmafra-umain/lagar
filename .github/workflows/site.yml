name: Site

# Tests and builds the landing page, then deploys it to
# Vercel: a preview for every pull request (URL posted on the PR), production on main.
# Pull requests from forks build and test but never deploy (no secrets there).

on:
  pull_request:
    paths:
      - landing/**
      - DESIGN.md
      - collector/data/statistics.json
      - app/shared/src/commonMain/composeResources/font/**
      - scripts/build-site.sh
      - .github/workflows/site.yml
  push:
    branches: [main]
    paths:
      - landing/**
      - DESIGN.md
      - collector/data/statistics.json
      - app/shared/src/commonMain/composeResources/font/**
      - scripts/build-site.sh
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # All three secrets or no deploy: without the IDs the CLI would link a new project.
      DEPLOY: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' && !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"


      - name: Landing page tests
        run: |
          python3 -I -m unittest discover -s landing/tests
          node --test landing/tests/lang.test.cjs landing/tests/catalog.test.cjs landing/tests/stats.test.cjs

      - name: Build
        run: scripts/build-site.sh

      - name: Deploy preview
        id: preview
        if: env.DEPLOY == 'true' && github.event_name == 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@63.1.2 deploy build/landing --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Post preview URL
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Landing page preview: $URL (commit ${GITHUB_SHA::7})"

      - name: Deploy production
        if: env.DEPLOY == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@63.1.2 deploy build/landing --prod --yes --token "$VERCEL_TOKEN")
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
