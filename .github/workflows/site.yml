name: Site

# Tests and builds the landing page with the web app under /app/, then deploys it to
# Vercel: a preview for every pull request (URL posted on the PR), production on main.
# Pull requests from forks build and test but never deploy (no secrets there).

on:
  pull_request:
    paths:
      - landing/**
      - DESIGN.md
      - app/**
      - scripts/build-site.sh
      - .github/workflows/site.yml
  push:
    branches: [main]
    paths:
      - landing/**
      - DESIGN.md
      - app/**
      - scripts/build-site.sh
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # All three secrets or no deploy: without the IDs the CLI would link a new project.
      DEPLOY: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' && !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Landing page tests
        run: |
          python3 -I -m unittest discover -s landing/tests
          node --test landing/tests/lang.test.cjs landing/tests/catalog.test.cjs

      - name: Build
        run: scripts/build-site.sh

      - name: Deploy preview
        id: preview
        if: env.DEPLOY == 'true' && github.event_name == 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@63.1.2 deploy build/landing --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Post preview URL
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Landing page preview: $URL (commit ${GITHUB_SHA::7})"

      # The web app reads the API from GitHub Pages. When this push also deploys Pages, wait for
      # it so the new app does not go live against the previous API. A failed or cancelled Pages
      # run does not block: a newer push deploys again, and the home tolerates a missing listing.
      - name: Wait for the API deploy
        if: env.DEPLOY == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=""
          for _ in 1 2 3 4 5 6; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --commit "$GITHUB_SHA" \
              --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "No Pages run for $GITHUB_SHA; deploying without waiting."
            exit 0
          fi
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status > /dev/null \
            || echo "::warning::Pages run $run did not succeed; deploying anyway."

      - name: Deploy production
        if: env.DEPLOY == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@63.1.2 deploy build/landing --prod --yes --token "$VERCEL_TOKEN")
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
