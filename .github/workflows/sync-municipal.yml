name: Sync municipal regulations

# Weekly check of every kommun in collector/data/municipalities.json. Changes land as
# one pull request on the data/municipal-sync branch. The job merges that pull request
# into main once its collector tests and the corpus audit pass; a run with no changes
# opens nothing. A kommun added to the config joins the next run.
#
# The collector state is not committed, so every run reads the listings again;
# documents already in the committed manifest at the same URL are not downloaded
# again. Unchanged documents are left untouched.

on:
  schedule:
    - cron: "17 5 * * 2" # Tuesdays
  workflow_dispatch:
    inputs:
      kommun:
        description: "Only these kommun codes (space separated); defaults to every kommun"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-municipal
  cancel-in-progress: false

env:
  BRANCH: data/municipal-sync
  REPORTS: build/municipal-reports
  GH_TOKEN: ${{ github.token }}
  # Reports regenerated by every sync; conflicts on them are resolved by regenerating.
  GENERATED: PROGRESS.md progress.svg README.md AGENCIES.md collector/data/agencies-report.json landing/data/sources.json collector/data/pending-integrity.json sources/municipal-manifest.json STATISTICS.md collector/data/statistics.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Start from main or the open sync pull request
        id: base
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -z "$pr" ]; then
            git checkout -B "$BRANCH" origin/main
            exit 0
          fi
          git checkout -B "$BRANCH" "origin/$BRANCH"
          if ! git merge --no-edit origin/main; then
            conflicted=$(git diff --name-only --diff-filter=U)
            for file in $conflicted; do
              case " $GENERATED " in
                *" $file "*) ;;
                *) echo "::error::sync branch conflicts with main in $file; resolve it by hand"; exit 1 ;;
              esac
            done
            # Take main's reports for now; they are regenerated before the next commit.
            git checkout --theirs -- $conflicted
            git add -- $conflicted
            git commit --no-edit
          fi

      - name: Install poppler-utils and tesseract
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends
          poppler-utils tesseract-ocr tesseract-ocr-swe

      - name: Collector tests
        run: python3 -I -m unittest discover -s collector/tests -t collector

      - name: Choose the kommuner
        id: kommuner
        env:
          INPUT_KOMMUN: ${{ inputs.kommun }}
        run: |
          codes=$(jq -r '.kommuner | keys[]' collector/data/municipalities.json | tr '\n' ' ')
          if [ -n "$INPUT_KOMMUN" ]; then
            for code in $INPUT_KOMMUN; do
              if ! [[ "$code" =~ ^[0-9]{4}$ ]]; then
                echo "::error::kommun codes are four digits: $code"; exit 1
              fi
            done
            codes="$INPUT_KOMMUN"
          fi
          echo "codes=$codes" >> "$GITHUB_OUTPUT"

      - name: Collect every kommun
        id: collect
        env:
          CODES: ${{ steps.kommuner.outputs.codes }}
        run: |
          mkdir -p "$REPORTS"
          failed=()
          # One kommun's failure (a changed page, a block) must not stop the others.
          for code in $CODES; do
            python3 -I collector/collect.py municipal --kommun "$code" \
              --report "$REPORTS/$code.json" || failed+=("$code")
          done
          # The run still commits what the others collected; the summary and the commit
          # message list the failures, and the next run tries them again.
          echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
          for code in "${failed[@]}"; do echo "::warning::kommun $code failed; see the step log"; done

      - name: Summarise the run
        if: always() && steps.kommuner.outcome == 'success'
        env:
          CODES: ${{ steps.kommuner.outputs.codes }}
          OUTCOME: ${{ steps.collect.outcome }}
          FAILED: ${{ steps.collect.outputs.failed }}
        run: |
          {
            echo "### Municipal sync"
            echo "- Collector: $OUTCOME"
            echo "- Failed: ${FAILED:-none}"
            echo
            echo "| kommun | written | unchanged | skipped | gaps | failed | blocked |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            for code in $CODES; do
              report="$REPORTS/$code.json"
              if [ -f "$report" ]; then
                jq -r --arg c "$code" '"| \($c) | \(.written | length) | \(.unchanged | length) | \(.skipped) | \(.gaps | length) | \(.failed | join(", ")) | \(.blocked | to_entries | map(.value) | join("; ")) |"' "$report"
              else
                echo "| $code | no report: the config could not be read (see the step log) | | | | | |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and open the pull request
        env:
          PR: ${{ steps.base.outputs.pr }}
          FAILED: ${{ steps.collect.outputs.failed }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$(git status --porcelain -- corpus)" ]; then
            echo "No corpus changes; nothing to commit."
            exit 0
          fi
          python3 -I collector/audit.py
          python3 -I collector/plan.py
          python3 -I collector/stats.py
          python3 -I collector/agencies.py
          written=$(cat "$REPORTS"/*.json | jq -s -r '[.[].written[]] | join(", ")')
          count=$(cat "$REPORTS"/*.json | jq -s -r '[.[].written[]] | length')
          {
            echo "data(municipal): sync $count municipal regulations"
            echo
            echo "Written: $written"
            if [ -n "$FAILED" ]; then echo; echo "Failed: $FAILED"; fi
          } > "$RUNNER_TEMP/message"
          git add -- corpus $GENERATED
          git commit -q -F "$RUNNER_TEMP/message"
          git push --force-with-lease origin "HEAD:$BRANCH"
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Sync municipal regulations" \
              --label "type: data" --label "area: corpus" \
              --assignee "$OWNER" \
              --body "Automated weekly sync of the kommunala författningssamlingar listed in collector/data/municipalities.json. Each run adds one commit that lists the regulations it wrote; the workflow run summaries list gaps, failures and blocked kommuner."
          fi

      - name: Merge the pull request into main
        run: bash .github/scripts/merge-sync-pr.sh
