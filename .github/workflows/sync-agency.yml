name: Sync agency regulations

# Weekly check of every agency regulation series with an adapter in
# collector/lagar/agency.py (AFS, FFFS, TSFS and the series listed in
# collector/data/agency-series.json). A new series joins the sync as soon as it is
# registered there. Changes land as one pull request on the data/agency-sync branch.
# The job merges that pull request into main once its collector tests and the corpus
# audit pass; a run with no changes opens nothing.
#
# The collector state is not committed, so every run reads the listings and
# detail pages again; PDFs already in the committed manifest are not
# downloaded again. Unchanged documents are left untouched. Series indexed by
# year (TSFS) read only the current and previous year.

on:
  schedule:
    - cron: "17 5 * * 2" # Tuesdays
  workflow_dispatch:
    inputs:
      series:
        description: "Only these series, space-separated (e.g. 'AFS SKSFS'); defaults to all"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-agency
  cancel-in-progress: false

env:
  BRANCH: data/agency-sync
  REPORTS: build/agency-reports
  GH_TOKEN: ${{ github.token }}
  # Reports regenerated by every sync; conflicts on them are resolved by regenerating.
  GENERATED: PROGRESS.md progress.svg README.md AGENCIES.md collector/data/agencies-report.json landing/data/sources.json collector/data/pending-integrity.json sources/agency-pdf-manifest.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Start from main or the open sync pull request
        id: base
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -z "$pr" ]; then
            git checkout -B "$BRANCH" origin/main
            exit 0
          fi
          git checkout -B "$BRANCH" "origin/$BRANCH"
          if ! git merge --no-edit origin/main; then
            conflicted=$(git diff --name-only --diff-filter=U)
            for file in $conflicted; do
              case " $GENERATED " in
                *" $file "*) ;;
                *) echo "::error::sync branch conflicts with main in $file; resolve it by hand"; exit 1 ;;
              esac
            done
            # Take main's reports for now; they are regenerated before the next commit.
            git checkout --theirs -- $conflicted
            git add -- $conflicted
            git commit --no-edit
          fi

      - name: Install poppler-utils
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils

      - name: Collector tests
        env:
          LAGAR_REQUIRE_PDFTOTEXT: "1"
        run: python3 -I -m unittest discover -s collector/tests -t collector

      - name: List the series
        id: series
        env:
          INPUT_SERIES: ${{ inputs.series }}
        run: |
          # "<series> yearly" for series read by year, "<series> full" for the others.
          python3 -I - > "$RUNNER_TEMP/series" <<'EOF'
          import os, sys
          sys.path.insert(0, "collector")
          from lagar import agency
          wanted = {s.upper() for s in os.environ.get("INPUT_SERIES", "").split()}
          for code, adapter in agency.ADAPTERS.items():
              if not wanted or code.upper() in wanted:
                  print(code, "yearly" if hasattr(adapter, "year_url") else "full")
          EOF
          if [ ! -s "$RUNNER_TEMP/series" ]; then
            echo "::error::no series matches '$INPUT_SERIES'"; exit 1
          fi
          cat "$RUNNER_TEMP/series"

      - name: Collect every series
        id: collect
        run: |
          mkdir -p "$REPORTS"
          year=$(date -u +%Y)
          failed=()
          # One series' failure (a changed page, a block) must not stop the others.
          while read -r code mode; do
            years=()
            if [ "$mode" = yearly ]; then
              years=(--year "$year" --year "$(( year - 1 ))")
            fi
            python3 -I collector/collect.py agency --series "$code" "${years[@]}" \
              --report "$REPORTS/$code.json" < /dev/null || failed+=("$code")
          done < "$RUNNER_TEMP/series"
          # The run still commits what the others collected; the summary and the commit
          # message list the failures, and the next run tries them again.
          echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
          for code in "${failed[@]}"; do echo "::warning::series $code failed; see the step log"; done

      - name: Summarise the run
        if: always() && steps.series.outcome == 'success'
        env:
          OUTCOME: ${{ steps.collect.outcome }}
          FAILED: ${{ steps.collect.outputs.failed }}
        run: |
          {
            echo "### Agency sync"
            echo "- Collector: $OUTCOME"
            echo "- Failed: ${FAILED:-none}"
            echo
            echo "| series | written | unchanged | excluded | PDFs hashed | failed | blocked |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            while read -r code mode; do
              report="$REPORTS/$code.json"
              if [ -f "$report" ]; then
                jq -r --arg c "$code" '"| \($c) | \(.written | length) | \(.unchanged) | \(.excluded) | \(.pdfs) | \(.failed | join(", ")) | \(.blocked) |"' "$report"
              else
                echo "| $code | no report: the listing could not be read (see the step log) | | | | | |"
              fi
            done < "$RUNNER_TEMP/series"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and open the pull request
        env:
          PR: ${{ steps.base.outputs.pr }}
          FAILED: ${{ steps.collect.outputs.failed }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$(git status --porcelain -- corpus)" ]; then
            echo "No corpus changes; nothing to commit."
            exit 0
          fi
          python3 -I collector/audit.py
          python3 -I collector/plan.py
          python3 -I collector/agencies.py
          written=$(cat "$REPORTS"/*.json | jq -s -r '[.[].written[]] | join(", ")')
          count=$(cat "$REPORTS"/*.json | jq -s -r '[.[].written[]] | length')
          {
            echo "data(agency): sync $count agency regulations"
            echo
            echo "Written: $written"
            if [ -n "$FAILED" ]; then echo; echo "Failed: $FAILED"; fi
          } > "$RUNNER_TEMP/message"
          git add -- corpus $GENERATED
          git commit -q -F "$RUNNER_TEMP/message"
          git push --force-with-lease origin "HEAD:$BRANCH"
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Sync agency regulations" \
              --label "type: data" --label "area: corpus" --label "source: agency" \
              --assignee "$OWNER" \
              --body "Automated weekly sync of the agency regulation series with an adapter. Each run adds one commit that lists the regulations it wrote; the workflow run summaries list failures and blocks per series."
          fi

      - name: Merge the pull request into main
        run: bash .github/scripts/merge-sync-pr.sh
