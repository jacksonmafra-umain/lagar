name: Sync county regulations

# Weekly check of the county administrative boards' författningssamlingar for the
# current and previous year. Changes land as one pull request on the
# data/county-sync branch; a run with no changes opens nothing.
#
# The collector state is not committed, so every run reads the landing pages, the
# year indexes and the detail pages again; PDFs already in the committed manifest
# are not downloaded again. Unchanged documents are left untouched.

on:
  schedule:
    - cron: "41 4 * * 1" # Mondays
  workflow_dispatch:
    inputs:
      from_year:
        description: "First year to collect (YYYY); defaults to the previous year"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-county
  cancel-in-progress: false

env:
  BRANCH: data/county-sync
  REPORTS: build/county-reports
  GH_TOKEN: ${{ github.token }}
  # Reports regenerated by every sync; conflicts on them are resolved by regenerating.
  GENERATED: PROGRESS.md progress.svg README.md AGENCIES.md collector/data/agencies-report.json landing/data/sources.json collector/data/pending-integrity.json sources/county-pdf-manifest.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Start from main or the open sync pull request
        id: base
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -z "$pr" ]; then
            git checkout -B "$BRANCH" origin/main
            exit 0
          fi
          git checkout -B "$BRANCH" "origin/$BRANCH"
          if ! git merge --no-edit origin/main; then
            conflicted=$(git diff --name-only --diff-filter=U)
            for file in $conflicted; do
              case " $GENERATED " in
                *" $file "*) ;;
                *) echo "::error::sync branch conflicts with main in $file; resolve it by hand"; exit 1 ;;
              esac
            done
            # Take main's reports for now; they are regenerated before the next commit.
            git checkout --theirs -- $conflicted
            git add -- $conflicted
            git commit --no-edit
          fi

      - name: Install poppler-utils
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils

      - name: Collector tests
        env:
          LAGAR_REQUIRE_PDFTOTEXT: "1"
        run: python3 -I -m unittest discover -s collector/tests -t collector

      - name: Choose the years
        id: years
        env:
          INPUT_FROM_YEAR: ${{ inputs.from_year }}
        run: |
          from=$(( $(date -u +%Y) - 1 ))
          if [ -n "$INPUT_FROM_YEAR" ]; then
            if ! [[ "$INPUT_FROM_YEAR" =~ ^(19|20)[0-9]{2}$ ]]; then
              echo "::error::from_year must be YYYY"; exit 1
            fi
            from="$INPUT_FROM_YEAR"
          fi
          echo "from=$from" >> "$GITHUB_OUTPUT"

      - name: Collect every county
        id: collect
        env:
          FROM: ${{ steps.years.outputs.from }}
        run: |
          mkdir -p "$REPORTS"
          status=0
          # One county's failure (a changed page, a block) must not stop the others.
          for code in $(jq -r '.counties | keys[]' collector/data/counties.json); do
            python3 -I collector/collect.py county --county "$code" --from-year "$FROM" \
              --report "$REPORTS/$code.json" || status=1
          done
          exit $status

      - name: Summarise the run
        if: always() && steps.years.outcome == 'success'
        env:
          FROM: ${{ steps.years.outputs.from }}
          OUTCOME: ${{ steps.collect.outcome }}
        run: |
          {
            echo "### County sync from $FROM"
            echo "- Collector: $OUTCOME"
            echo
            echo "| county | written | unchanged | skipped | failed | unnumbered | blocked |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            for code in $(jq -r '.counties | keys[]' collector/data/counties.json); do
              report="$REPORTS/$code.json"
              if [ -f "$report" ]; then
                jq -r --arg c "$code" '"| \($c) | \(.written | length) | \(.unchanged) | \(.skipped) | \(.failed | join(", ")) | \(.unnumbered | length) | \(.blocked) |"' "$report"
              else
                echo "| $code | no report: the listing could not be read (see the step log) | | | | | |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and open the pull request
        env:
          FROM: ${{ steps.years.outputs.from }}
          PR: ${{ steps.base.outputs.pr }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$(git status --porcelain -- corpus)" ]; then
            echo "No corpus changes; nothing to commit."
            exit 0
          fi
          python3 -I collector/audit.py
          python3 -I collector/plan.py
          python3 -I collector/agencies.py
          written=$(cat "$REPORTS"/*.json | jq -s -r '[.[].written[]] | join(", ")')
          count=$(cat "$REPORTS"/*.json | jq -s -r '[.[].written[]] | length')
          {
            echo "data(region): sync $count county regulations from $FROM"
            echo
            echo "Written: $written"
          } > "$RUNNER_TEMP/message"
          git add -- corpus $GENERATED
          git commit -q -F "$RUNNER_TEMP/message"
          git push --force-with-lease origin "HEAD:$BRANCH"
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Sync county regulations" \
              --label "type: data" --label "area: corpus" \
              --assignee "$OWNER" \
              --body "Automated weekly sync of the county administrative boards' regulations (current and previous year). Each run adds one commit that lists the regulations it wrote; the workflow run summaries list failures and unnumbered files."
          fi
