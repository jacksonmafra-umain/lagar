name: Sync EU

# Daily check of the Publications Office Cellar for changes to the curated EU acts
# (collector/data/eu-acts.json): the act itself, a new consolidated version or a new
# amending act. One SPARQL query finds the changed acts; only those are collected
# again, with their latest consolidated version. A second query finds the judgments of
# the Court of Justice and the General Court interpreting those acts that changed (or
# appeared) in Cellar, and collects them. Changes land as one pull request on the
# data/eu-sync branch. The job merges that pull request into main once its collector
# tests and the corpus audit pass; a run with no changes opens nothing.
#
# The sync markers (collector/data/eu-sync.json for the acts,
# collector/data/eu-case-law-sync.json for the judgments) only move inside a commit
# that carries the collected documents, so a failed or abandoned run never skips
# data: the next run starts again from the last committed markers.

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Re-collect acts changed since an earlier moment (YYYY-MM-DD or YYYY-MM-DDTHH:MM:SS[.mmm]Z, UTC); only used when older than the marker"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-eu
  cancel-in-progress: false

env:
  BRANCH: data/eu-sync
  MARKER: collector/data/eu-sync.json
  REPORT: build/eu-sync-report.json
  CASE_MARKER: collector/data/eu-case-law-sync.json
  CASE_REPORT: build/eu-case-law-sync-report.json
  GH_TOKEN: ${{ github.token }}
  # Reports regenerated by every sync; conflicts on them are resolved by regenerating.
  GENERATED: PROGRESS.md progress.svg README.md AGENCIES.md collector/data/agencies-report.json landing/data/sources.json collector/data/pending-integrity.json collector/data/eu-sync.json sources/eu-manifest.json collector/data/eu-case-law-sync.json sources/eu-case-law-manifest.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Start from main or the open sync pull request
        id: base
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -z "$pr" ]; then
            git checkout -B "$BRANCH" origin/main
            exit 0
          fi
          git checkout -B "$BRANCH" "origin/$BRANCH"
          if ! git merge --no-edit origin/main; then
            conflicted=$(git diff --name-only --diff-filter=U)
            for file in $conflicted; do
              case " $GENERATED " in
                *" $file "*) ;;
                *) echo "::error::sync branch conflicts with main in $file; resolve it by hand"; exit 1 ;;
              esac
            done
            # Take main's reports for now; they are regenerated before the next commit.
            # The marker and manifest then come from main too, which only widens the window.
            git checkout --theirs -- $conflicted
            git add -- $conflicted
            git commit --no-edit
          fi

      - name: Install poppler-utils
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils

      - name: Collector tests
        run: python3 -I -m unittest discover -s collector/tests -t collector

      - name: Choose the window
        id: window
        env:
          INPUT_SINCE: ${{ inputs.since }}
        run: |
          pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{3})?Z)?$'
          since=$(jq -r .changed_since "$MARKER")
          if ! [[ "$since" =~ $pattern ]]; then
            echo "::error::invalid marker in $MARKER: $since"; exit 1
          fi
          if [ -n "$INPUT_SINCE" ]; then
            if ! [[ "$INPUT_SINCE" =~ $pattern ]]; then
              echo "::error::since must be YYYY-MM-DD or YYYY-MM-DDTHH:MM:SS[.mmm]Z"; exit 1
            fi
            # Only widen the window: a later start would skip changes for good.
            if [[ "$INPUT_SINCE" < "$since" ]]; then since="$INPUT_SINCE"; fi
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"
          case_since=$(jq -r .changed_since "$CASE_MARKER")
          if ! [[ "$case_since" =~ $pattern ]]; then
            echo "::error::invalid marker in $CASE_MARKER: $case_since"; exit 1
          fi
          if [ -n "$INPUT_SINCE" ] && [[ "$INPUT_SINCE" < "$case_since" ]]; then case_since="$INPUT_SINCE"; fi
          echo "case_since=$case_since" >> "$GITHUB_OUTPUT"

      - name: Collect changed acts
        id: collect
        env:
          SINCE: ${{ steps.window.outputs.since }}
        run: |
          python3 -I collector/collect.py eu --list collector/data/eu-acts.json --consolidated \
            --changed-since "$SINCE" --report "$REPORT"

      - name: Collect changed judgments
        id: cases
        if: always() && steps.window.outcome == 'success'
        env:
          SINCE: ${{ steps.window.outputs.case_since }}
        run: |
          python3 -I collector/collect.py eu-case-law --list collector/data/eu-acts.json \
            --changed-since "$SINCE" --report "$CASE_REPORT"

      - name: Summarise the run
        if: always() && steps.window.outcome == 'success'
        env:
          SINCE: ${{ steps.window.outputs.since }}
          OUTCOME: ${{ steps.collect.outcome }}
        run: |
          {
            echo "### EU sync since $SINCE"
            echo "- Collector: $OUTCOME"
            if [ -f "$REPORT" ]; then
              echo "- Written: $(jq -r '.written | length' "$REPORT") ($(jq -r '.written | join(", ")' "$REPORT"))"
              echo "- Unchanged: $(jq -r '.unchanged | length' "$REPORT")"
              echo "- Gaps: $(jq -r '.gaps | join(", ")' "$REPORT")"
              echo "- Failed: $(jq -r '.failed | length' "$REPORT") ($(jq -r '.failed | join(", ")' "$REPORT"))"
              echo "- Blocked: $(jq -r .blocked "$REPORT")"
              echo "- Newest change: $(jq -r '.latest_modified // "none"' "$REPORT")"
              echo "- Retry from: $(jq -r '.retry_from // "none"' "$REPORT")"
            else
              echo "- No report: the changed acts could not be listed (see the step log)."
            fi
            echo "### EU judgments since ${{ steps.window.outputs.case_since }}"
            echo "- Collector: ${{ steps.cases.outcome }}"
            if [ -f "$CASE_REPORT" ]; then
              echo "- Written: $(jq -r '.written | length' "$CASE_REPORT") ($(jq -r '.written | join(", ")' "$CASE_REPORT"))"
              echo "- Unchanged: $(jq -r '.unchanged | length' "$CASE_REPORT")"
              echo "- Gaps: $(jq -r '.gaps | join(", ")' "$CASE_REPORT")"
              echo "- Failed: $(jq -r '.failed | length' "$CASE_REPORT") ($(jq -r '.failed | join(", ")' "$CASE_REPORT"))"
              echo "- Blocked: $(jq -r .blocked "$CASE_REPORT")"
            else
              echo "- No report: the changed judgments could not be listed (see the step log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and open the pull request
        env:
          SINCE: ${{ steps.window.outputs.since }}
          PR: ${{ steps.base.outputs.pr }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$(git status --porcelain -- corpus/eu)" ]; then
            echo "No corpus changes; nothing to commit."
            exit 0
          fi
          # Hold each marker at the oldest document that was not collected so it is retried
          # next run; a marker without a report or without changes stays where it is.
          moment='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'
          for pair in "$REPORT:$MARKER" "$CASE_REPORT:$CASE_MARKER"; do
            report=${pair%%:*} marker=${pair#*:}
            [ -f "$report" ] || continue
            next=$(jq -r '.retry_from // .latest_modified // empty' "$report")
            [ -n "$next" ] || continue
            if ! [[ "$next" =~ $moment ]]; then
              echo "::error::unexpected marker from $report: $next"; exit 1
            fi
            jq -n --arg ts "$next" '{changed_since: $ts}' > "$marker"
          done
          python3 -I collector/audit.py
          python3 -I collector/plan.py
          python3 -I collector/agencies.py
          {
            written=$(jq -s '[.[].written | length] | add' "$REPORT" "$CASE_REPORT" 2>/dev/null || jq '.written | length' "$REPORT")
            echo "data(eu): sync $written EU documents changed since $SINCE"
            echo
            for report in "$REPORT" "$CASE_REPORT"; do
              [ -f "$report" ] || continue
              echo "Written: $(jq -r '.written | join(", ")' "$report")"
              failed=$(jq -r '.failed | join(", ")' "$report")
              if [ -n "$failed" ]; then echo "Failed: $failed"; fi
            done
          } > "$RUNNER_TEMP/message"
          git add -- corpus/eu $GENERATED
          git commit -q -F "$RUNNER_TEMP/message"
          git push --force-with-lease origin "HEAD:$BRANCH"
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Sync changed EU acts" \
              --label "type: data" --label "area: corpus" \
              --assignee "$OWNER" \
              --body "Automated sync of the curated EU acts that changed in the Publications Office Cellar, with their latest consolidated version, and of the Court of Justice and General Court judgments interpreting them. Each run adds one commit that lists the documents it wrote; the workflow run summaries list failures and gaps."
          fi

      - name: Merge the pull request into main
        run: bash .github/scripts/merge-sync-pr.sh
