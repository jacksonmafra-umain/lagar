name: API

on:
  pull_request:
    paths:
      - api/**
      - corpus/**
      - collector/**
      - docs/schema/**
      - ruff.toml
      - .github/workflows/api.yml
  push:
    branches: [main]
    paths:
      - api/**
      - corpus/**
      - collector/**
      - docs/schema/**
      - ruff.toml
      - .github/workflows/api.yml

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Lint
        run: pipx run ruff==0.17.3 check api

      - name: Tests
        run: python3 -I -m unittest discover -s api/tests -t .

      # Fails on schema errors, duplicate ids or files outside their type folder.
      - name: Audit the corpus
        run: python3 -I collector/audit.py

      # The generator validates every document's frontmatter against the schema and fails on any error.
      - name: Build the API from the full corpus
        run: python3 -I api/build.py --corpus corpus --out build/api/v1

      # The API alone, so a pull request that would push the Pages site over its budget fails here first.
      - name: Check the API size
        run: python3 -I api/size_report.py --api build/api/v1 --summary "$GITHUB_STEP_SUMMARY"
