name: Sync SÖ

# Weekly check of Sveriges internationella överenskommelser (SÖ) on regeringen.se. The
# sitemap gives every SÖ page with its last modification; pages modified in the last
# 15 days are read again (new treaties, a later entry into force, a replaced PDF), so
# a missed week is caught by the next run. Changes land as one pull request on the
# data/so-sync branch. The job merges that pull request into main once its collector
# tests and the corpus audit pass; a run with no changes opens nothing. Unchanged
# documents are left untouched.

on:
  schedule:
    - cron: "41 4 * * 1" # Mondays
  workflow_dispatch:
    inputs:
      from_year:
        description: "First year to collect (YYYY); defaults to the previous year"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-so
  cancel-in-progress: false

env:
  BRANCH: data/so-sync
  REPORT: build/so-sync-report.json
  GH_TOKEN: ${{ github.token }}
  # Reports regenerated by every sync; conflicts on them are resolved by regenerating.
  GENERATED: PROGRESS.md progress.svg README.md AGENCIES.md collector/data/agencies-report.json landing/data/sources.json collector/data/pending-integrity.json sources/so-pdf-manifest.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Start from main or the open sync pull request
        id: base
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -z "$pr" ]; then
            git checkout -B "$BRANCH" origin/main
            exit 0
          fi
          git checkout -B "$BRANCH" "origin/$BRANCH"
          if ! git merge --no-edit origin/main; then
            conflicted=$(git diff --name-only --diff-filter=U)
            for file in $conflicted; do
              case " $GENERATED " in
                *" $file "*) ;;
                *) echo "::error::sync branch conflicts with main in $file; resolve it by hand"; exit 1 ;;
              esac
            done
            # Take main's reports for now; they are regenerated before the next commit.
            git checkout --theirs -- $conflicted
            git add -- $conflicted
            git commit --no-edit
          fi

      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Collector tests
        env:
          LAGAR_REQUIRE_PDFTOTEXT: "1"
        run: python3 -I -m unittest discover -s collector/tests -t collector

      - name: Choose the window
        id: window
        env:
          INPUT_SINCE: ${{ inputs.since }}
        run: |
          since=$(date -u -d '15 days ago' +%F)
          if [ -n "$INPUT_SINCE" ]; then
            if ! [[ "$INPUT_SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::since must be YYYY-MM-DD"; exit 1
            fi
            since="$INPUT_SINCE"
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"

      - name: Collect changed SÖ pages
        id: collect
        env:
          SINCE: ${{ steps.window.outputs.since }}
        run: python3 -I collector/collect.py so --changed-since "$SINCE" --report "$REPORT"

      - name: Summarise the run
        if: always() && steps.window.outcome == 'success'
        env:
          SINCE: ${{ steps.window.outputs.since }}
          OUTCOME: ${{ steps.collect.outcome }}
        run: |
          {
            echo "### SÖ sync since $SINCE"
            echo "- Collector: $OUTCOME"
            if [ -f "$REPORT" ]; then
              echo "- Written: $(jq -r '.written | length' "$REPORT") ($(jq -r '.written | join(", ")' "$REPORT"))"
              echo "- Unchanged: $(jq -r '.unchanged | length' "$REPORT")"
              echo "- Without text: $(jq -r '.text_gaps | join(", ")' "$REPORT")"
              echo "- Failed: $(jq -r '.failed | join(", ")' "$REPORT")"
              echo "- Blocked: $(jq -r .blocked "$REPORT")"
            else
              echo "- No report: the sitemap could not be read (see the step log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and open the pull request
        env:
          SINCE: ${{ steps.window.outputs.since }}
          PR: ${{ steps.base.outputs.pr }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$(git status --porcelain -- corpus)" ]; then
            echo "No corpus changes; nothing to commit."
            exit 0
          fi
          python3 -I collector/audit.py
          python3 -I collector/plan.py
          python3 -I collector/agencies.py
          {
            echo "data(so): sync $(jq -r '.written | length' "$REPORT") SÖ treaties changed since $SINCE"
            echo
            echo "Written: $(jq -r '.written | join(", ")' "$REPORT")"
          } > "$RUNNER_TEMP/message"
          git add -- corpus $GENERATED
          git commit -q -F "$RUNNER_TEMP/message"
          git push --force-with-lease origin "HEAD:$BRANCH"
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Sync SÖ treaties" \
              --label "type: data" --label "area: corpus" \
              --assignee "$OWNER" \
              --body "Automated weekly sync of Sveriges internationella överenskommelser (SÖ) from regeringen.se. Each run adds one commit that lists the treaties it wrote; the workflow run summaries list failures and treaties without extracted text."
          fi

      - name: Merge the pull request into main
        run: |
          # Land the sync on main once this job's collector tests and the corpus audit have
          # passed. A sync pull request left open by an earlier run is merged the same way.
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open sync pull request; nothing to merge."
            exit 0
          fi
          # The start step may have merged main into an older sync branch without pushing it.
          git fetch -q origin "$BRANCH"
          if [ "$(git branch --show-current)" = "$BRANCH" ] && [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            git push --force-with-lease="$BRANCH:$(git rev-parse FETCH_HEAD)" origin "HEAD:$BRANCH"
          fi
          python3 -I collector/audit.py
          head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          # GitHub may need a moment to compute mergeability of a pull request it just got.
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$pr" --merge --match-head-commit "$head"; then
              git push origin --delete "$BRANCH" || true
              echo "Merged #$pr into main." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::could not merge #$pr into main; it stays open for the next run"
          exit 1
