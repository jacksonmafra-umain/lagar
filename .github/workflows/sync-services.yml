name: Sync services

# Weekly check of the public services (Tjänster) in the curated list
# collector/data/services.json. Every official page is read again: a changed title or
# lead rewrites its corpus file, and a page that moved, is gone or cannot be read is
# marked in sources/services-manifest.json, keeps its previous corpus file and is
# listed in the run summary, the commit message and STATISTICS.md. Changes land as one
# pull request on the data/services-sync branch. The job merges that pull request into
# main once its collector tests and the corpus audit pass; a run with no changes opens
# nothing. Unchanged pages leave the corpus and the manifest untouched.

on:
  schedule:
    - cron: "41 4 * * 5" # Fridays, apart from the other weekly syncs
  workflow_dispatch:
    inputs:
      slug:
        description: "Services to read, space-separated slugs (default: every service in the list)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-services
  cancel-in-progress: false

env:
  BRANCH: data/services-sync
  REPORT: build/services-sync-report.json
  # SYNC_TOKEN (fine-grained, this repository: contents and pull requests read and write)
  # makes the pull request and the merge trigger the other workflows; the workflow token
  # is the fallback, whose pull request runs wait for an approval that never comes.
  GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
  # Reports regenerated by every sync; conflicts on them are resolved by regenerating.
  GENERATED: PROGRESS.md progress.svg README.md AGENCIES.md collector/data/agencies-report.json landing/data/sources.json collector/data/pending-integrity.json sources/services-manifest.json STATISTICS.md collector/data/statistics.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Start from main or the open sync pull request
        id: base
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -z "$pr" ]; then
            git checkout -B "$BRANCH" origin/main
            exit 0
          fi
          git checkout -B "$BRANCH" "origin/$BRANCH"
          if ! git merge --no-edit origin/main; then
            conflicted=$(git diff --name-only --diff-filter=U)
            for file in $conflicted; do
              case " $GENERATED " in
                *" $file "*) ;;
                *) echo "::error::sync branch conflicts with main in $file; resolve it by hand"; exit 1 ;;
              esac
            done
            # Take main's reports for now; they are regenerated before the next commit.
            git checkout --theirs -- $conflicted
            git add -- $conflicted
            git commit --no-edit
          fi

      - name: Collector tests
        run: python3 -I -m unittest discover -s collector/tests -t collector

      - name: Choose the services
        id: services
        env:
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          args=""
          for slug in $INPUT_SLUG; do
            if ! [[ "$slug" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "::error::not a service slug: $slug"; exit 1
            fi
            args="$args --slug $slug"
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Collect the services
        id: collect
        env:
          ARGS: ${{ steps.services.outputs.args }}
        run: |
          code=0
          # shellcheck disable=SC2086 # ARGS is a list of --slug options
          python3 -I collector/collect.py services $ARGS --report "$REPORT" || code=$?
          # 2: a host answered 403. Its pages keep their files and are listed as failed;
          # the other hosts' changes are still committed, and the next run tries again.
          if [ "$code" = 2 ]; then
            echo "::warning::blocked by $(jq -r '.blocked_hosts | join(", ")' "$REPORT"); see the step log"
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi

      - name: Summarise the run
        if: always() && steps.services.outcome == 'success'
        env:
          OUTCOME: ${{ steps.collect.outcome }}
        run: |
          {
            echo "### Services sync"
            echo "- Collector: $OUTCOME"
            if [ -f "$REPORT" ]; then
              echo "- Written: $(jq -r '.written | length' "$REPORT") ($(jq -r '.written | join(", ")' "$REPORT"))"
              echo "- Unchanged: $(jq -r '.unchanged | length' "$REPORT")"
              echo "- Moved: $(jq -r '[.moved[] | "\(.slug) -> \(.final_url)"] | join(", ")' "$REPORT")"
              echo "- Failed: $(jq -r '[.failed[] | "\(.slug) (\(.result), \(.error // .status))"] | join(", ")' "$REPORT")"
              echo "- Blocked hosts: $(jq -r '.blocked_hosts | join(", ")' "$REPORT")"
            else
              echo "- No report: the list or the state could not be read (see the step log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and open the pull request
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          # The manifest changes on its own when a page moves or dies; that is worth a commit too.
          if [ -z "$(git status --porcelain -- corpus sources/services-manifest.json)" ]; then
            echo "No corpus or manifest changes; nothing to commit."
            exit 0
          fi
          python3 -I collector/audit.py
          python3 -I collector/plan.py
          python3 -I collector/stats.py
          python3 -I collector/agencies.py
          written=$(jq -r '.written | join(", ")' "$REPORT")
          moved=$(jq -r '[.moved[] | "\(.slug) -> \(.final_url)"] | join(", ")' "$REPORT")
          failed=$(jq -r '[.failed[] | "\(.slug) (\(.result))"] | join(", ")' "$REPORT")
          {
            echo "data(services): sync $(jq -r '.written | length' "$REPORT") public services"
            echo
            echo "Written: ${written:-none}"
            if [ -n "$moved" ]; then echo; echo "Moved: $moved"; fi
            if [ -n "$failed" ]; then echo; echo "Failed: $failed"; fi
          } > "$RUNNER_TEMP/message"
          git add -- corpus $GENERATED
          git commit -q -F "$RUNNER_TEMP/message"
          bash .github/scripts/push-sync-branch.sh
          # The push script may have opened the pull request again; look it up.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Sync public services" \
              --label "type: data" --label "area: corpus" \
              --assignee "$OWNER" \
              --body "Automated weekly sync of the public services in collector/data/services.json. Each run adds one commit that lists the services it wrote and the pages that moved or failed; the workflow run summaries list them too, and STATISTICS.md counts the moved and dead pages."
          fi

      - name: Merge the pull request into main
        run: bash .github/scripts/merge-sync-pr.sh
