name: Sync case law

# Daily check of Sveriges Domstolar's rättspraxis API for new and republished
# referat and notiser. Changes land as one pull request on the data/case-law-sync
# branch; a run with no changes opens nothing.
#
# The sync marker (collector/data/case-law-sync.json) only moves inside a commit that
# carries the collected documents, so a failed or abandoned run never skips data:
# the next run starts again from the last committed marker.

on:
  schedule:
    - cron: "47 5 * * *" # the source updates daily; runs after the SFS sync
  workflow_dispatch:
    inputs:
      since:
        description: "Re-collect from an earlier publication day (YYYY-MM-DD); only used when older than the marker"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-case-law
  cancel-in-progress: false

env:
  BRANCH: data/case-law-sync
  MARKER: collector/data/case-law-sync.json
  REPORT: build/case-law-sync-report.json
  GH_TOKEN: ${{ github.token }}
  # Reports regenerated by every sync; conflicts on them are resolved by regenerating.
  GENERATED: PROGRESS.md progress.svg README.md AGENCIES.md collector/data/agencies-report.json landing/data/sources.json collector/data/pending-integrity.json collector/data/case-law-sync.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Start from main or the open sync pull request
        id: base
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -z "$pr" ]; then
            git checkout -B "$BRANCH" origin/main
            exit 0
          fi
          git checkout -B "$BRANCH" "origin/$BRANCH"
          if ! git merge --no-edit origin/main; then
            conflicted=$(git diff --name-only --diff-filter=U)
            for file in $conflicted; do
              case " $GENERATED " in
                *" $file "*) ;;
                *) echo "::error::sync branch conflicts with main in $file; resolve it by hand"; exit 1 ;;
              esac
            done
            # Take main's reports for now; they are regenerated before the next commit.
            git checkout --theirs -- $conflicted
            git add -- $conflicted
            git commit --no-edit
          fi

      - name: Install poppler-utils
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends poppler-utils

      - name: Collector tests
        run: python3 -I -m unittest discover -s collector/tests -t collector

      - name: Choose the window
        id: window
        env:
          INPUT_SINCE: ${{ inputs.since }}
        run: |
          pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          since=$(jq -r .published_since "$MARKER")
          if ! [[ "$since" =~ $pattern ]]; then
            echo "::error::invalid marker in $MARKER: $since"; exit 1
          fi
          if [ -n "$INPUT_SINCE" ]; then
            if ! [[ "$INPUT_SINCE" =~ $pattern ]]; then
              echo "::error::since must be YYYY-MM-DD"; exit 1
            fi
            # Only widen the window: a later start would skip publications for good.
            if [[ "$INPUT_SINCE" < "$since" ]]; then since="$INPUT_SINCE"; fi
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"

      - name: Collect new publications
        id: collect
        env:
          SINCE: ${{ steps.window.outputs.since }}
        run: python3 -I collector/collect.py case-law --since "$SINCE" --report "$REPORT"

      - name: Summarise the run
        if: always() && steps.window.outcome == 'success'
        env:
          SINCE: ${{ steps.window.outputs.since }}
          OUTCOME: ${{ steps.collect.outcome }}
        run: |
          {
            echo "### Case-law sync since $SINCE"
            echo "- Collector: $OUTCOME"
            if [ -f "$REPORT" ]; then
              echo "- Written: $(jq -r '.written | length' "$REPORT") ($(jq -r '.written | join(", ")' "$REPORT"))"
              echo "- Unchanged: $(jq -r .unchanged "$REPORT")"
              echo "- Excluded (not referat or notis): $(jq -r .excluded "$REPORT")"
              echo "- Failed: $(jq -r '.failed | length' "$REPORT") ($(jq -r '.failed | join(", ")' "$REPORT"))"
              echo "- Blocked: $(jq -r .blocked "$REPORT")"
              echo "- Newest publication: $(jq -r '.latest_published // "none"' "$REPORT")"
              echo "- Next run from: $(jq -r '.next_since // "unchanged"' "$REPORT")"
            else
              echo "- No report: the listing could not be read (see the step log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and open the pull request
        env:
          SINCE: ${{ steps.window.outputs.since }}
          PR: ${{ steps.base.outputs.pr }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$(git status --porcelain -- corpus)" ]; then
            echo "No corpus changes; nothing to commit."
            exit 0
          fi
          next=$(jq -r '.next_since // empty' "$REPORT")
          if ! [[ "$next" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then next="$SINCE"; fi
          jq -n --arg day "$next" '{published_since: $day}' > "$MARKER"
          python3 -I collector/audit.py
          python3 -I collector/plan.py
          python3 -I collector/agencies.py
          {
            echo "data(case-law): sync $(jq -r '.written | length' "$REPORT") publications since $SINCE"
            echo
            echo "Written: $(jq -r '.written | join(", ")' "$REPORT")"
            failed=$(jq -r '.failed | join(", ")' "$REPORT")
            if [ -n "$failed" ]; then echo; echo "Failed: $failed"; fi
          } > "$RUNNER_TEMP/message"
          git add -- corpus $GENERATED
          git commit -q -F "$RUNNER_TEMP/message"
          git push --force-with-lease origin "HEAD:$BRANCH"
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Sync new case law" \
              --label "type: data" --label "area: corpus" \
              --assignee "$OWNER" \
              --body "Automated sync of referat and notiser that Sveriges Domstolar published or republished. Each run adds one commit that lists the publications it wrote; the workflow run summaries list failures."
          fi
