name: Sync SFS

# Daily check of Riksdagen for new and amended SFS documents. Each statute it writes
# also gets its amendment register (SFSR) read again, and the
# svenskforfattningssamling.se RSS feed adds new authoritative PDFs to the snapshot
# manifest. Changes land as one pull request on the data/sfs-sync branch. The job
# merges that pull request into main once its collector tests and the corpus audit
# pass; a run with no changes opens nothing.
#
# The sync marker (collector/data/sfs-sync.json) only moves inside a commit that
# carries the collected documents, so a failed or abandoned run never skips data:
# the next run starts again from the last committed marker.

on:
  schedule:
    - cron: "23 5 * * *" # after Riksdagen's nightly update (about 04:40 Swedish time)
  workflow_dispatch:
    inputs:
      since:
        description: "Re-collect from an earlier systemdatum (YYYY-MM-DD[ HH:MM:SS]); only used when older than the marker"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-sfs
  cancel-in-progress: false

env:
  BRANCH: data/sfs-sync
  MARKER: collector/data/sfs-sync.json
  REPORT: build/sync-report.json
  SFSR_REPORT: build/sfsr-report.json
  PDF_REPORT: build/sfspdf-report.json
  # Source manifests committed with the corpus (collector state files are gitignored).
  SOURCES: sources/sfsr-manifest.json sources/sfs-pdf-manifest.json
  GH_TOKEN: ${{ github.token }}
  # Reports regenerated by every sync; conflicts on them are resolved by regenerating.
  GENERATED: PROGRESS.md progress.svg README.md AGENCIES.md collector/data/agencies-report.json landing/data/sources.json collector/data/pending-integrity.json collector/data/sfs-sync.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Start from main or the open sync pull request
        id: base
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -z "$pr" ]; then
            git checkout -B "$BRANCH" origin/main
            exit 0
          fi
          git checkout -B "$BRANCH" "origin/$BRANCH"
          if ! git merge --no-edit origin/main; then
            conflicted=$(git diff --name-only --diff-filter=U)
            for file in $conflicted; do
              case " $GENERATED " in
                *" $file "*) ;;
                *) echo "::error::sync branch conflicts with main in $file; resolve it by hand"; exit 1 ;;
              esac
            done
            # Take main's reports for now; they are regenerated before the next commit.
            git checkout --theirs -- $conflicted
            git add -- $conflicted
            git commit --no-edit
          fi

      - name: Collector tests
        run: python3 -I -m unittest discover -s collector/tests -t collector

      - name: Choose the window
        id: window
        env:
          INPUT_SINCE: ${{ inputs.since }}
        run: |
          pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}( [0-9]{2}:[0-9]{2}:[0-9]{2})?$'
          since=$(jq -r .changed_since "$MARKER")
          if ! [[ "$since" =~ $pattern ]]; then
            echo "::error::invalid marker in $MARKER: $since"; exit 1
          fi
          if [ -n "$INPUT_SINCE" ]; then
            if ! [[ "$INPUT_SINCE" =~ $pattern ]]; then
              echo "::error::since must be YYYY-MM-DD or YYYY-MM-DD HH:MM:SS"; exit 1
            fi
            # Only widen the window: a later start would skip documents for good.
            if [[ "$INPUT_SINCE" < "$since" ]]; then since="$INPUT_SINCE"; fi
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"

      - name: Collect changed documents
        id: collect
        env:
          SINCE: ${{ steps.window.outputs.since }}
        run: python3 -I collector/collect.py sfs --changed-since "$SINCE" --report "$REPORT"

      - name: Read the amendment register of written statutes
        id: sfsr
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: |
          args=()
          for number in $(jq -r '.written[] | select(test("^N?[0-9]{4}:[0-9]+$"))' "$REPORT"); do
            args+=(--number "$number")
          done
          if [ ${#args[@]} -eq 0 ]; then echo "No statutes written."; exit 0; fi
          python3 -I collector/collect.py sfsr --refresh "${args[@]}" --report "$SFSR_REPORT"

      - name: Snapshot new authoritative PDFs
        id: sfspdf
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python3 -I collector/collect.py sfspdf --rss --report "$PDF_REPORT"

      - name: Summarise the run
        if: always() && steps.window.outcome == 'success'
        env:
          SINCE: ${{ steps.window.outputs.since }}
          OUTCOME: ${{ steps.collect.outcome }}
          SFSR_OUTCOME: ${{ steps.sfsr.outcome }}
          PDF_OUTCOME: ${{ steps.sfspdf.outcome }}
        run: |
          {
            echo "### SFS sync since $SINCE"
            echo "- Collector: $OUTCOME"
            if [ -f "$REPORT" ]; then
              echo "- Written: $(jq -r '.written | length' "$REPORT") ($(jq -r '.written | join(", ")' "$REPORT"))"
              echo "- Unchanged: $(jq -r .unchanged "$REPORT")"
              echo "- Failed: $(jq -r '.failed | length' "$REPORT") ($(jq -r '.failed | join(", ")' "$REPORT"))"
              echo "- Blocked: $(jq -r .blocked "$REPORT")"
              echo "- Newest systemdatum: $(jq -r '.latest_systemdatum // "none"' "$REPORT")"
              echo "- Retry from: $(jq -r '.retry_from // "none"' "$REPORT")"
            else
              echo "- No report: the listing could not be read (see the step log)."
            fi
            echo "- Amendment register: $SFSR_OUTCOME"
            if [ -f "$SFSR_REPORT" ]; then
              echo "  - Written: $(jq -r '.written | length' "$SFSR_REPORT"), failed: $(jq -r '.failed | join(", ")' "$SFSR_REPORT")"
            fi
            echo "- PDF snapshots: $PDF_OUTCOME"
            if [ -f "$PDF_REPORT" ]; then
              echo "  - Recorded: $(jq -r '.recorded | length' "$PDF_REPORT"), failed: $(jq -r '.failed | join(", ")' "$PDF_REPORT")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and open the pull request
        env:
          SINCE: ${{ steps.window.outputs.since }}
          PR: ${{ steps.base.outputs.pr }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$(git status --porcelain -- corpus $SOURCES)" ]; then
            echo "No corpus or source manifest changes; nothing to commit."
            exit 0
          fi
          # Hold the marker at the oldest network failure so it is retried next run.
          next=$(jq -r '.retry_from // .latest_systemdatum' "$REPORT")
          jq -n --arg ts "$next" '{changed_since: $ts}' > "$MARKER"
          python3 -I collector/audit.py
          python3 -I collector/plan.py
          python3 -I collector/agencies.py
          {
            echo "data(sfs): sync $(jq -r '.written | length' "$REPORT") statutes changed since $SINCE"
            echo
            echo "Written: $(jq -r '.written | join(", ")' "$REPORT")"
            failed=$(jq -r '.failed | join(", ")' "$REPORT")
            if [ -n "$failed" ]; then echo; echo "Failed: $failed"; fi
            if [ -f "$PDF_REPORT" ]; then
              recorded=$(jq -r '.recorded | join(", ")' "$PDF_REPORT")
              if [ -n "$recorded" ]; then echo; echo "PDF snapshots: $recorded"; fi
            fi
          } > "$RUNNER_TEMP/message"
          git add -- corpus $GENERATED $SOURCES
          git commit -q -F "$RUNNER_TEMP/message"
          git push --force-with-lease origin "HEAD:$BRANCH"
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Sync new and amended SFS documents" \
              --label "type: data" --label "area: corpus" \
              --assignee "$OWNER" \
              --body "Automated sync of SFS documents that Riksdagen added or changed. Each run adds one commit that lists the statutes it wrote; the workflow run summaries list failures."
          fi

      - name: Merge the pull request into main
        run: |
          # Land the sync on main once this job's collector tests and the corpus audit have
          # passed. A sync pull request left open by an earlier run is merged the same way.
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open sync pull request; nothing to merge."
            exit 0
          fi
          # The start step may have merged main into an older sync branch without pushing it.
          git fetch -q origin "$BRANCH"
          if [ "$(git branch --show-current)" = "$BRANCH" ] && [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            git push --force-with-lease="$BRANCH:$(git rev-parse FETCH_HEAD)" origin "HEAD:$BRANCH"
          fi
          python3 -I collector/audit.py
          head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          # GitHub may need a moment to compute mergeability of a pull request it just got.
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$pr" --merge --match-head-commit "$head"; then
              git push origin --delete "$BRANCH" || true
              echo "Merged #$pr into main." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::could not merge #$pr into main; it stays open for the next run"
          exit 1
