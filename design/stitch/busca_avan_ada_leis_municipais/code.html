<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Busca Avançada - Itajaí/SC</title>
<!-- Tailwind CSS v3 with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            carmim: {
              DEFAULT: '#b71c1c',
              dark: '#8b0000',
              deep: '#731313',
              light: '#fde8e8',
              surface: 'rgba(183, 28, 28, 0.08)'
            },
            glass: {
              card: 'rgba(255, 255, 255, 0.82)',
              cardBorder: 'rgba(255, 255, 255, 0.65)',
              input: 'rgba(255, 255, 255, 0.7)',
              inputBorder: 'rgba(203, 213, 225, 0.6)'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
            'glass-subtle': '0 4px 16px 0 rgba(0, 0, 0, 0.03)',
            'carmim-glow': '0 10px 25px -3px rgba(183, 28, 28, 0.35), 0 4px 6px -2px rgba(183, 28, 28, 0.15)'
          }
        }
      }
    };
  </script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-glass-effects">
    /* iOS Momentum Scrolling & safe areas */
    body {
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Apple Liquid Glass Backdrop Blur styling */
    .liquid-glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
    }

    .liquid-glass-input {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      transition: all 0.2s ease;
    }

    .liquid-glass-input:focus {
      background: #ffffff;
      border-color: #b71c1c;
      box-shadow: 0 0 0 3px rgba(183, 28, 28, 0.12);
    }

    /* Custom Checkbox & Radio Accents (Material 3 Touch) */
    input[type="checkbox"], input[type="radio"] {
      color: #b71c1c;
      border-color: #cbd5e1;
      transition: all 0.15s ease-in-out;
    }
    input[type="checkbox"]:focus, input[type="radio"]:focus {
      --tw-ring-color: rgba(183, 28, 28, 0.25);
    }
    input[type="checkbox"]:checked, input[type="radio"]:checked {
      border-color: #b71c1c;
      background-color: #b71c1c;
    }

    /* Subtle background mesh gradient for authentic Apple frosted glass reflection */
    .bg-mesh-soft {
      background: radial-gradient(circle at 10% 20%, rgba(254, 242, 242, 0.7) 0%, rgba(248, 250, 252, 0.9) 60%, rgba(241, 245, 249, 0.85) 100%);
    }
  </style>
</head>
<body class="bg-mesh-soft min-h-screen text-slate-800 font-sans antialiased flex flex-col justify-between selection:bg-carmim-light selection:text-carmim">
<!-- BEGIN: MobileHeader -->
<header class="sticky top-0 z-40 bg-[#781313]/95 backdrop-blur-xl border-b border-white/10 shadow-md text-white px-5 py-3.5 flex items-center justify-between transition-all" data-purpose="top-navigation">
<!-- Header Title -->
<div class="flex items-center space-x-2.5">
<div class="w-2 h-2 rounded-full bg-red-300 animate-pulse"></div>
<h1 class="text-base font-semibold tracking-wide">Busca Avançada</h1>
</div>
<!-- Close Dismiss Button -->
<button aria-label="Fechar busca avançada" class="w-8 h-8 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 active:scale-95 transition text-white" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<line x1="18" x2="6" y1="6" y2="18"></line>
<line x1="6" x2="18" y1="6" y2="18"></line>
</svg>
</button>
</header>
<!-- END: MobileHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-4 py-4 max-w-lg mx-auto w-full pb-28 space-y-4" data-purpose="advanced-search-container">
<!-- BEGIN: QuickLocationField -->
<!-- Campo fixo de localidade com ícone de pin -->
<div class="relative" data-purpose="location-picker">
<label class="sr-only" for="location-input">Município selecionado</label>
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-carmim">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M12 21.75c4.5-5.25 7.5-9.75 7.5-13.5A7.5 7.5 0 004.5 8.25c0 3.75 3 8.25 7.5 13.5z" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="12" cy="8.25" r="2.25"></circle>
</svg>
</div>
<input class="liquid-glass-input w-full pl-11 pr-10 py-3 rounded-2xl text-[14px] font-medium text-slate-800 focus:outline-none cursor-default shadow-sm border border-slate-200/80" id="location-input" readonly="" type="text" value="Itajaí/SC"/>
<div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- END: QuickLocationField -->
<!-- BEGIN: SearchTermField -->
<!-- Campo de termo ou número de lei -->
<div class="relative" data-purpose="search-keyword-input">
<label class="sr-only" for="search-term">Termo ou número da lei</label>
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="liquid-glass-input w-full pl-11 pr-4 py-3 rounded-2xl text-[14px] text-slate-700 placeholder-slate-400 focus:outline-none shadow-sm" id="search-term" placeholder="Digite número ou termo para pesquisar" type="text"/>
</div>
<!-- END: SearchTermField -->
<!-- BEGIN: DateIntervalCard -->
<!-- Card de Intervalos de datas com Liquid Glass -->
<section class="liquid-glass-card rounded-2xl p-4 transition-all" data-purpose="date-range-filter">
<h2 class="text-sm font-semibold text-slate-800 mb-3 tracking-tight">Pesquise por intervalos de datas dos atos</h2>
<div class="space-y-2.5">
<!-- Date Start -->
<div class="relative">
<label class="sr-only" for="date-start">A partir de</label>
<input class="liquid-glass-input w-full pl-3.5 pr-10 py-2.5 rounded-xl text-xs sm:text-sm text-slate-700 placeholder-slate-400 focus:outline-none" id="date-start" placeholder="A partir de: dd/mm/aaaa" type="text"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Date End -->
<div class="relative">
<label class="sr-only" for="date-end">Até</label>
<input class="liquid-glass-input w-full pl-3.5 pr-10 py-2.5 rounded-xl text-xs sm:text-sm text-slate-700 placeholder-slate-400 focus:outline-none" id="date-end" placeholder="Até: dd/mm/aaaa" type="text"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Clear Interval Button -->
<div class="flex justify-end pt-1">
<button class="inline-flex items-center text-[11px] font-semibold tracking-wider text-slate-400 uppercase py-1.5 px-3 rounded-full border border-slate-200/80 hover:bg-slate-50 transition active:scale-95" data-purpose="clear-date-interval" type="button">
<svg class="w-3 h-3 mr-1 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
            LIMPAR INTERVALO
          </button>
</div>
</div>
</section>
<!-- END: DateIntervalCard -->
<!-- BEGIN: ActsAccordion -->
<!-- Seção expansível: Atos de Itajaí -->
<section class="liquid-glass-card rounded-2xl p-4 transition-all" data-purpose="acts-selection-panel">
<div class="flex items-center justify-between cursor-pointer mb-3">
<h2 class="text-sm font-semibold text-slate-800 tracking-tight">Atos de Itajaí</h2>
<svg class="w-4 h-4 text-slate-500 transform transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M5 15l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Quick Actions (Material 3 Pill Chips) -->
<div class="flex items-center space-x-2 mb-3.5">
<button class="text-[11px] font-semibold uppercase px-3 py-1 rounded-full border border-carmim/80 text-carmim bg-carmim-surface hover:bg-carmim/10 transition active:scale-95" type="button">
          MARCAR TODOS
        </button>
<button class="text-[11px] font-semibold uppercase px-3 py-1 rounded-full border border-slate-200 text-slate-400 bg-transparent hover:bg-slate-100 transition active:scale-95" type="button">
          LIMPAR
        </button>
</div>
<!-- 2-Column Checkbox Grid -->
<div class="grid grid-cols-2 gap-x-3 gap-y-2.5 text-xs text-slate-700">
<!-- Col 1 -->
<label class="flex items-start space-x-2 cursor-pointer select-none">
<input class="mt-0.5 rounded text-carmim focus:ring-carmim h-4 w-4 border-slate-300" type="checkbox"/>
<span class="leading-snug">Decreto</span>
</label>
<!-- Col 2 -->
<label class="flex items-start space-x-2 cursor-pointer select-none">
<input class="mt-0.5 rounded text-carmim focus:ring-carmim h-4 w-4 border-slate-300" type="checkbox"/>
<span class="leading-snug">Decreto Legislativo</span>
</label>
<!-- Col 1 -->
<label class="flex items-start space-x-2 cursor-pointer select-none">
<input class="mt-0.5 rounded text-carmim focus:ring-carmim h-4 w-4 border-slate-300" type="checkbox"/>
<span class="leading-snug">Emenda à Lei Orgânica</span>
</label>
<!-- Col 2 -->
<label class="flex items-start space-x-2 cursor-pointer select-none">
<input class="mt-0.5 rounded text-carmim focus:ring-carmim h-4 w-4 border-slate-300" type="checkbox"/>
<span class="leading-snug">Lei Complementar</span>
</label>
<!-- Col 1 -->
<label class="flex items-start space-x-2 cursor-pointer select-none">
<input class="mt-0.5 rounded text-carmim focus:ring-carmim h-4 w-4 border-slate-300" type="checkbox"/>
<span class="leading-snug">Lei Ordinária</span>
</label>
<!-- Col 2 -->
<label class="flex items-start space-x-2 cursor-pointer select-none">
<input class="mt-0.5 rounded text-carmim focus:ring-carmim h-4 w-4 border-slate-300" type="checkbox"/>
<span class="leading-snug">Resolução</span>
</label>
<!-- Col 1 -->
<label class="flex items-start space-x-2 cursor-pointer select-none col-span-2">
<input class="mt-0.5 rounded text-carmim focus:ring-carmim h-4 w-4 border-slate-300" type="checkbox"/>
<span class="leading-snug">Resolução de Mesa</span>
</label>
</div>
</section>
<!-- END: ActsAccordion -->
<!-- BEGIN: SearchTypeSection -->
<!-- Seção de tipo de pesquisa com Radio Buttons -->
<section class="liquid-glass-card rounded-2xl p-4 transition-all" data-purpose="search-scope-type">
<div class="flex items-center justify-between cursor-pointer mb-3">
<h2 class="text-sm font-semibold text-slate-800 tracking-tight">Tipo de Pesquisa</h2>
<svg class="w-4 h-4 text-slate-500 transform transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M5 15l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs text-slate-700">
<label class="flex items-center space-x-2.5 cursor-pointer select-none py-0.5">
<input checked="" class="text-carmim focus:ring-carmim h-4 w-4 border-slate-300" name="tipo-pesquisa" type="radio"/>
<span>Todos os tipos de pesquisa</span>
</label>
<label class="flex items-center space-x-2.5 cursor-pointer select-none py-0.5">
<input class="text-carmim focus:ring-carmim h-4 w-4 border-slate-300" name="tipo-pesquisa" type="radio"/>
<span>Pesquisar pela ementa</span>
</label>
<label class="flex items-center space-x-2.5 cursor-pointer select-none py-0.5">
<input class="text-carmim focus:ring-carmim h-4 w-4 border-slate-300" name="tipo-pesquisa" type="radio"/>
<span>Pesquisar pela íntegra</span>
</label>
</div>
</section>
<!-- END: SearchTypeSection -->
<!-- BEGIN: LawStatusSection -->
<!-- Seção de Status da Lei com Radio Buttons em Grid -->
<section class="liquid-glass-card rounded-2xl p-4 transition-all" data-purpose="law-status-panel">
<div class="flex items-center justify-between cursor-pointer mb-3">
<h2 class="text-sm font-semibold text-slate-800 tracking-tight">Status da Lei</h2>
<svg class="w-4 h-4 text-slate-500 transform transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M5 15l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-3 gap-y-2.5 text-xs text-slate-700">
<!-- Radio item -->
<label class="flex items-start space-x-2.5 cursor-pointer select-none">
<input checked="" class="mt-0.5 text-carmim focus:ring-carmim h-4 w-4 border-slate-300" name="status-lei" type="radio"/>
<span class="leading-tight">Todos os status</span>
</label>
<!-- Radio item -->
<label class="flex items-start space-x-2.5 cursor-pointer select-none">
<input class="mt-0.5 text-carmim focus:ring-carmim h-4 w-4 border-slate-300" name="status-lei" type="radio"/>
<span class="leading-tight">Atos anulados</span>
</label>
<!-- Radio item -->
<label class="flex items-start space-x-2.5 cursor-pointer select-none">
<input class="mt-0.5 text-carmim focus:ring-carmim h-4 w-4 border-slate-300" name="status-lei" type="radio"/>
<span class="leading-tight">Atos cancelados</span>
</label>
<!-- Radio item -->
<label class="flex items-start space-x-2.5 cursor-pointer select-none">
<input class="mt-0.5 text-carmim focus:ring-carmim h-4 w-4 border-slate-300" name="status-lei" type="radio"/>
<span class="leading-tight">Atos com vigência esgotada</span>
</label>
<!-- Radio item -->
<label class="flex items-start space-x-2.5 cursor-pointer select-none">
<input class="mt-0.5 text-carmim focus:ring-carmim h-4 w-4 border-slate-300" name="status-lei" type="radio"/>
<span class="leading-tight">Atos declarados sem efeito</span>
</label>
<!-- Radio item -->
<label class="flex items-start space-x-2.5 cursor-pointer select-none">
<input class="mt-0.5 text-carmim focus:ring-carmim h-4 w-4 border-slate-300" name="status-lei" type="radio"/>
<span class="leading-tight">Atos em vigor</span>
</label>
<!-- Radio item com descrição longa -->
<label class="flex items-start space-x-2.5 cursor-pointer select-none">
<input class="mt-0.5 text-carmim focus:ring-carmim h-4 w-4 border-slate-300" name="status-lei" type="radio"/>
<span class="leading-tight">Atos que contém informações revogadas tacitamente</span>
</label>
<!-- Radio item -->
<label class="flex items-start space-x-2.5 cursor-pointer select-none">
<input class="mt-0.5 text-carmim focus:ring-carmim h-4 w-4 border-slate-300" name="status-lei" type="radio"/>
<span class="leading-tight">Atos repristinados</span>
</label>
<!-- Radio item -->
<label class="flex items-start space-x-2.5 cursor-pointer select-none">
<input class="mt-0.5 text-carmim focus:ring-carmim h-4 w-4 border-slate-300" name="status-lei" type="radio"/>
<span class="leading-tight">Atos revogados</span>
</label>
</div>
</section>
<!-- END: LawStatusSection -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: StickyBottomAction -->
<!-- Barra de ação fixa inferior com blur estilo Apple HIG -->
<footer class="fixed bottom-0 left-0 right-0 z-50 p-4 bg-white/80 backdrop-blur-xl border-t border-slate-200/80" data-purpose="primary-action-bar">
<div class="max-w-lg mx-auto">
<button class="w-full bg-[#b71c1c] hover:bg-[#a01818] active:bg-[#8b1414] text-white font-semibold py-3.5 px-6 rounded-2xl shadow-carmim-glow tracking-wide text-sm flex items-center justify-center space-x-2 transform active:scale-[0.98] transition-all" type="submit">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>BUSCAR</span>
</button>
</div>
</footer>
<!-- END: StickyBottomAction -->
</body></html>
